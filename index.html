<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROLE HF</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --txt:#1c2330; --mut:#6b7587; --pri:#1f4e9c; --pri2:#173b78; --bd:#dde3ee; --err:#c0392b; --ok:#1e8e5a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  .oculto { display:none !important; }
  button { font:inherit; cursor:pointer; }
  input, select, textarea { font:inherit; width:100%; padding:11px 12px; border:1px solid var(--bd); border-radius:10px; background:#fff; color:var(--txt); }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--pri); border-color:transparent; }
  label { display:block; font-size:.85rem; color:var(--mut); margin:12px 0 5px; }
  .btn { background:var(--pri); color:#fff; border:0; padding:12px 18px; border-radius:10px; font-weight:600; }
  .btn:hover { background:var(--pri2); }
  .btn.sec { background:#e8edf6; color:var(--pri); }
  .btn.sec:hover { background:#dbe3f1; }
  .btn.perigo { background:#fdecea; color:var(--err); }
  .btn.mini { padding:6px 10px; font-size:.82rem; }
  .msg { min-height:20px; font-size:.9rem; margin-top:10px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }

  /* Login */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box { background:var(--card); width:100%; max-width:380px; border-radius:18px; box-shadow:0 10px 30px rgba(20,40,80,.12); overflow:hidden; text-align:center; }
  .login-img { background:#e8edf6; min-height:150px; display:flex; align-items:center; justify-content:center; }
  .login-img img { width:100%; max-height:240px; object-fit:cover; display:block; }
  .login-corpo { padding:22px 24px 26px; }
  .login-corpo h1 { margin:0 0 4px; font-size:1.5rem; letter-spacing:.5px; }
  .login-corpo p { margin:0 0 14px; color:var(--mut); font-size:.9rem; }

  /* App */
  header { background:var(--pri); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:1.15rem; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; padding:7px 12px; border-radius:8px; }
  nav { display:flex; gap:6px; padding:12px 14px 0; max-width:900px; margin:0 auto; }
  nav button { flex:1; padding:11px; border:0; background:#e8edf6; color:var(--pri); border-radius:10px 10px 0 0; font-weight:600; }
  nav button.ativa { background:var(--card); box-shadow:0 -2px 0 var(--pri) inset; }
  main { max-width:900px; margin:0 auto; padding:0 14px 40px; }
  .card { background:var(--card); border-radius:0 0 14px 14px; padding:18px; box-shadow:0 2px 10px rgba(20,40,80,.06); }
  .linha2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px) { .linha2 { grid-template-columns:1fr; } }
  .acoes { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .aviso-edicao { background:#fff6dd; border:1px solid #f0dc9a; padding:9px 12px; border-radius:10px; font-size:.9rem; margin-bottom:6px; }

  .filtros { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .filtros > div { flex:1; min-width:150px; }
  .resumo { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin:16px 0; }
  .res { background:#f1f5fb; border-radius:12px; padding:12px; text-align:center; }
  .res b { display:block; font-size:1.4rem; color:var(--pri); }
  .res span { font-size:.8rem; color:var(--mut); }
  .tabela { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--bd); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  .tag { display:inline-block; padding:2px 9px; border-radius:20px; font-size:.78rem; font-weight:600; background:#e8edf6; color:var(--pri); }
  .tag.Pix { background:#e0f5ee; color:#14754a; } .tag.Cartão { background:#e8e6fb; color:#4b3fb5; }
  .tag.Dinheiro { background:#fff0d6; color:#9a6200; } .tag.Oferta { background:#fde6f0; color:#a4306a; }
  .vazio { text-align:center; color:var(--mut); padding:26px 0; }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="login-box">
    <div class="login-img"><img id="imgLogin" alt="" class="oculto"></div>
    <div class="login-corpo">
      <h1>CONTROLE HF</h1>
      <p>Digite a senha para entrar</p>
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:12px" id="btnEntrar">Entrar</button>
      <div class="msg err" id="msgLogin"></div>
    </div>
  </div>
</section>

<!-- APP -->
<section id="app" class="oculto">
  <header>
    <h1>CONTROLE HF</h1>
    <button id="btnSair">Sair</button>
  </header>
  <nav>
    <button id="tabCad" class="ativa">Cadastro</button>
    <button id="tabRel">Relatório</button>
  </nav>
  <main>
    <!-- Cadastro -->
    <div class="card" id="telaCad">
      <div class="aviso-edicao oculto" id="avisoEdicao">Editando um cadastro. Salve para atualizar ou cancele.</div>
      <label for="fNome">Nome completo</label>
      <input id="fNome" placeholder="Nome completo" autocomplete="off">
      <div class="linha2">
        <div>
          <label for="fForma">Forma de pagamento</label>
          <select id="fForma">
            <option value="">Selecione...</option>
            <option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Oferta</option>
          </select>
        </div>
        <div>
          <label for="fData">Data da inscrição</label>
          <input type="date" id="fData">
        </div>
      </div>
      <label for="fObs">Observação</label>
      <textarea id="fObs" rows="3" placeholder="Opcional"></textarea>
      <div class="acoes">
        <button class="btn" id="btnSalvar">Salvar cadastro</button>
        <button class="btn sec oculto" id="btnCancelar">Cancelar edição</button>
      </div>
      <div class="msg" id="msgCad"></div>
    </div>

    <!-- Relatório -->
    <div class="card oculto" id="telaRel">
      <div class="filtros">
        <div><label for="fMes">Mês</label><input type="month" id="fMes"></div>
        <div><label for="fBusca">Buscar nome</label><input id="fBusca" placeholder="Digite parte do nome"></div>
        <button class="btn sec" id="btnTodos">Ver todos</button>
      </div>
      <div class="resumo" id="resumo"></div>
      <div class="tabela">
        <table>
          <thead><tr><th>Data</th><th>Nome</th><th>Pagamento</th><th>Obs.</th><th></th></tr></thead>
          <tbody id="corpo"></tbody>
        </table>
        <div class="vazio oculto" id="vazio">Nenhum cadastro encontrado.</div>
      </div>
      <div class="msg" id="msgRel"></div>
    </div>
  </main>
</section>

<script>
  var token = sessionStorage.getItem('hf_token') || '';
  var registros = [];
  var editandoId = '';

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function hojeISO() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function mesAtual() { return hojeISO().slice(0, 7); }

  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, erro) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
        var m = (e && e.message) ? e.message : String(e);
        if (/Sessão expirada/.test(m)) sair();
        erro(new Error(m.replace(/^Error:\s*/, '')));
      })[fn].apply(google.script.run, args);
    });
  }

  function mostrar(msgEl, texto, tipo) { msgEl.textContent = texto || ''; msgEl.className = 'msg ' + (tipo || ''); }

  /* Login */
  api('getImagemLogin').then(function (url) {
    if (url) { var im = $('imgLogin'); im.src = url; im.classList.remove('oculto'); }
  }).catch(function () {});

  function entrar() {
    mostrar($('msgLogin'), '');
    var b = $('btnEntrar'); b.disabled = true; b.textContent = 'Entrando...';
    api('login', $('senha').value).then(function (r) {
      if (r.ok) { token = r.token; sessionStorage.setItem('hf_token', token); abrirApp(); }
      else mostrar($('msgLogin'), r.msg, 'err');
    }).catch(function (e) { mostrar($('msgLogin'), e.message, 'err'); })
      .then(function () { b.disabled = false; b.textContent = 'Entrar'; $('senha').value = ''; });
  }
  $('btnEntrar').onclick = entrar;
  $('senha').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });

  function abrirApp() {
    $('login').classList.add('oculto'); $('app').classList.remove('oculto');
    $('fData').value = hojeISO(); $('fMes').value = mesAtual();
    carregar();
  }
  function sair() {
    token = ''; sessionStorage.removeItem('hf_token');
    $('app').classList.add('oculto'); $('login').classList.remove('oculto');
  }
  $('btnSair').onclick = sair;

  /* Abas */
  function aba(qual) {
    $('tabCad').classList.toggle('ativa', qual === 'cad');
    $('tabRel').classList.toggle('ativa', qual === 'rel');
    $('telaCad').classList.toggle('oculto', qual !== 'cad');
    $('telaRel').classList.toggle('oculto', qual !== 'rel');
    if (qual === 'rel') carregar();
  }
  $('tabCad').onclick = function () { aba('cad'); };
  $('tabRel').onclick = function () { aba('rel'); };

  /* Cadastro / edição */
  function limparForm() {
    editandoId = ''; $('fNome').value = ''; $('fForma').value = ''; $('fObs').value = ''; $('fData').value = hojeISO();
    $('avisoEdicao').classList.add('oculto'); $('btnCancelar').classList.add('oculto');
    $('btnSalvar').textContent = 'Salvar cadastro';
  }
  $('btnCancelar').onclick = function () { limparForm(); mostrar($('msgCad'), ''); };

  $('btnSalvar').onclick = function () {
    var r = { id: editandoId, nome: $('fNome').value, forma: $('fForma').value, data: $('fData').value, obs: $('fObs').value };
    if (!r.nome.trim()) return mostrar($('msgCad'), 'Informe o nome completo.', 'err');
    if (!r.forma) return mostrar($('msgCad'), 'Escolha a forma de pagamento.', 'err');
    var b = $('btnSalvar'); b.disabled = true; mostrar($('msgCad'), 'Salvando...');
    api('salvar', token, r).then(function () {
      var era = !!editandoId; limparForm();
      mostrar($('msgCad'), era ? 'Cadastro atualizado!' : 'Cadastro salvo!', 'ok');
    }).catch(function (e) { mostrar($('msgCad'), e.message, 'err'); })
      .then(function () { b.disabled = false; });
  };

  function editar(id) {
    var r = registros.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    editandoId = id; $('fNome').value = r.nome; $('fForma').value = r.forma; $('fData').value = r.data; $('fObs').value = r.obs;
    $('avisoEdicao').classList.remove('oculto'); $('btnCancelar').classList.remove('oculto');
    $('btnSalvar').textContent = 'Salvar alterações'; mostrar($('msgCad'), '');
    aba('cad'); window.scrollTo(0, 0);
  }

  function remover(id) {
    var r = registros.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    if (!confirm('Excluir o cadastro de ' + r.nome + '?')) return;
    api('excluir', token, id).then(carregar).catch(function (e) { mostrar($('msgRel'), e.message, 'err'); });
  }

  /* Relatório */
  function carregar() {
    mostrar($('msgRel'), 'Carregando...');
    api('listar', token, $('fMes').value).then(function (lista) {
      registros = lista; mostrar($('msgRel'), ''); desenhar();
    }).catch(function (e) { mostrar($('msgRel'), e.message, 'err'); });
  }
  $('fMes').onchange = carregar;
  $('btnTodos').onclick = function () { $('fMes').value = ''; carregar(); };
  $('fBusca').oninput = desenhar;

  function desenhar() {
    var q = $('fBusca').value.trim().toLowerCase();
    var lista = registros.filter(function (r) { return !q || r.nome.toLowerCase().indexOf(q) >= 0; });
    var cont = { Pix: 0, 'Cartão': 0, Dinheiro: 0, Oferta: 0 };
    lista.forEach(function (r) { if (cont[r.forma] != null) cont[r.forma]++; });
    $('resumo').innerHTML = '<div class="res"><b>' + lista.length + '</b><span>Inscrições</span></div>' +
      Object.keys(cont).map(function (k) { return '<div class="res"><b>' + cont[k] + '</b><span>' + k + '</span></div>'; }).join('');
    $('vazio').classList.toggle('oculto', lista.length > 0);
    $('corpo').innerHTML = lista.map(function (r) {
      var d = r.data.split('-').reverse().join('/');
      return '<tr><td>' + esc(d) + '</td><td>' + esc(r.nome) + '</td><td><span class="tag ' + esc(r.forma) + '">' + esc(r.forma) + '</span></td><td>' + esc(r.obs) + '</td>' +
        '<td style="white-space:nowrap"><button class="btn sec mini" data-e="' + esc(r.id) + '">Editar</button> <button class="btn perigo mini" data-x="' + esc(r.id) + '">Excluir</button></td></tr>';
    }).join('');
  }
  $('corpo').onclick = function (e) {
    var t = e.target;
    if (t.dataset.e) editar(t.dataset.e);
    if (t.dataset.x) remover(t.dataset.x);
  };

  if (token) abrirApp();
</script>
</body>
</html>
